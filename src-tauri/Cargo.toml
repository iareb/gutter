[package]
name = "gutter"
version = "0.1.0"
description = "A fast, open-source comic book reader that never degrades your pages"
authors = ["iareb"]
license = "MIT"
repository = "https://github.com/iareb/gutter"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "gutter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only stored and deflate entries: other codecs pull in C code that slows Android builds
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Reads width and height from image headers, without decoding
imagesize = "0.15"

# WebKitGTK cannot decode AVIF on Linux; the other webviews can. Pure Rust, but
# building it on x86 needs nasm.
[target.'cfg(target_os = "linux")'.dependencies]
avif-decode = { version = "3", default-features = false }
png = "0.18"

# Full debug info made the Android dev APK ~300 MB, slow to install over Wi-Fi.
# Keep file:line in backtraces for our code, drop the rest.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
