[package]
name = "gutter"
version = "0.1.0"
description = "A fast, open-source comic book reader that never degrades your pages"
authors = ["iareb"]
license = "MIT"
repository = "https://github.com/iareb/gutter"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "gutter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Full debug info made the Android dev APK ~300 MB, slow to install over Wi-Fi.
# Keep file:line in backtraces for our code, drop the rest.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
