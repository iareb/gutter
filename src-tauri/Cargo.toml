[package]
name = "gutter"
version = "0.1.0"
description = "A fast, open-source comic book reader that never degrades your pages"
authors = ["iareb"]
license = "MIT"
repository = "https://github.com/iareb/gutter"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "gutter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only stored and deflate entries: other codecs pull in C code that slows Android builds
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Files and folders chosen on Android, kept readable across restarts (M4)
tauri-plugin-documents = { path = "plugins/documents" }
# CBR files. Pure Rust, so it builds for Android from any machine; only reading is
# needed: no writing, recovery, passwords or threads (docs/spikes/cbr-library.md)
rars = { version = "0.12", default-features = false }
# Reads width and height from image headers, without decoding
imagesize = "0.15"
# The library. Bundled: the same SQLite on every platform, built from C by the NDK on Android
rusqlite = { version = "0.43", features = ["bundled"] }
# Covers for the library: decoding the first page and writing a small JPEG. Pure Rust
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# WebKitGTK cannot decode AVIF on Linux, and keeps touchpad pinch from the page;
# the other webviews do neither. AVIF decoding is pure Rust, but building it on
# x86 needs nasm.
[target.'cfg(target_os = "linux")'.dependencies]
# Touchpad pinch is read from the webview's GTK widget (the version Tauri uses)
gtk = "0.18"
avif-decode = { version = "3", default-features = false }
png = "0.18"

# Full debug info made the Android dev APK ~300 MB, slow to install over Wi-Fi.
# Keep file:line in backtraces for our code, drop the rest.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Decoding RAR archives is about 8 times slower without optimizations: a solid CBR
# would be unusable in a development build
[profile.dev.package.rars]
opt-level = 3

# The same for the covers: decoding a page and writing a JPEG take seconds without
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
